[package]
name = "clify"
version = "0.1.0"
edition = "2021"
description = "A native Navidrome music client"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:image", "dep:mpris-server", "dep:tokio"]

[[bin]]
name = "clify"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
directories = "6"
sha2 = "0.10"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.10", features = ["tokio"], optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
