name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux development libraries
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev dbus libglib2.0-bin
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: MPRIS over an isolated D-Bus session
        run: dbus-run-session -- env CLIFY_TEST_DBUS=1 cargo test --locked --bin clify mpris::tests::exports_metadata_and_forwards_next_on_session_bus
